<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de Obreiro — ICM</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<header class="topo">
  <a href="index.html" class="btn-home" title="Voltar para a tela inicial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/>
      <path d="M5.5 10v9a1 1 0 0 0 1 1h3.5v-6h4v6H17.5a1 1 0 0 0 1-1v-9"/>
    </svg>
  </a>
  <img src="assets/icon.png" alt="">
  <h1>Ficha de Obreiro — ICM</h1>
  <span class="status" id="status-topo">Carregando...</span>
</header>

<main>
  <div class="caixa-link">
    <div>
      <div class="rotulo">Link desta ficha (envie para o pastor continuar o preenchimento)</div>
      <input type="text" id="campo-link" readonly>
    </div>
    <button type="button" id="btn-copiar-link" class="secundario">🔗 Copiar Link</button>
  </div>

  <div id="secoes"><!-- preenchido por js/app.js --></div>
</main>

<div class="barra-acoes">
  <button type="button" id="btn-pdf" class="dourado">📄 Baixar PDF</button>
</div>

<div class="toast" id="toast"></div>

<!-- Fica fora de <main> de propósito: a regra de impressão esconde todo
     filho direto de <body> que não seja este, então se ficasse dentro de
     <main> o <main> inteiro (pai) seria escondido e levaria isto junto. -->
<div id="view-impressao"><!-- preenchido por js/pdf-render.js na hora de gerar o PDF --></div>

<!-- Firebase (SDK "compat", via CDN — sem precisar de build/npm) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/schema.js"></script>
<script src="js/storage.js"></script>
<script src="js/form-render.js"></script>
<script src="js/pdf-render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
